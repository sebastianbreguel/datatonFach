[project]
name = "datatonfach"
version = "0.2.0"
description = "Fire risk analysis over satellite imagery using DinoV2 features + FAISS KNN."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["remote-sensing", "wildfire", "dinov2", "faiss", "geospatial", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Benjamin Henriquez Soto", email = "benja20029@uc.cl" },
    { name = "Sebastian Breguel", email = "breguelsebastian@gmail.com" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "rasterio>=1.3.9",
    "rioxarray>=0.15.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "typer>=0.12",
    "pillow>=10.0",
    # UI
    "streamlit>=1.33",
    "leafmap>=0.31.7",
    "folium>=0.16",
    "localtileserver>=0.10.2",
    "psutil>=5.9",
    # ML
    "torch>=2.0",
    "torchvision>=0.15",
    "faiss-cpu>=1.7.4",
]

[project.scripts]
datatonfach = "datatonfach.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.6",
    "ruff>=0.4",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datatonfach"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["datatonfach"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E", "F", "B", "N"]
"tests/*" = ["N802", "N803"]
"src/datatonfach/cli.py" = ["B008"]  # typer.Option in defaults is idiomatic
"interface/*" = ["E", "F", "B", "N"]  # third-party streamlit views, left as-is

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
